<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>조태현 트레이너</title>
  <meta name="description" content="9년차 PT 트레이너 조태현. 직장인 스트레스 관리·체형 교정·다이어트·중장년 건강관리. 안 다치고 평생 가는 운동." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="조태현 트레이너" />
  <meta property="og:description" content="9년차 PT · 안 다치게, 평생 가는 운동" />
  <meta property="og:image" content="https://gus99688460-svg.github.io/trainer-portfolio/assets/images/profile.jpg" />
  <meta property="og:url" content="https://gus99688460-svg.github.io/trainer-portfolio/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="assets/css/style.css?v=35" />
</head>
<body>
  <header id="hero"></header>
  <nav>
    <a href="#about">소개</a>
    <a href="#process">진행방식</a>
    <a href="#reviews">후기</a>
    <a href="#before-after">비포/애프터</a>
    <a href="#contact">연락</a>
  </nav>
  <main>
    <section id="faq"></section>
    <section id="about"></section>
    <section id="process"></section>
    <section id="reviews"></section>
    <section id="before-after"></section>
    <section id="contact"></section>
  </main>
  <footer>
    <p>© <span id="year"></span> 조태현 트레이너</p>
  </footer>

  <!-- 모바일 하단 고정 상담 바 -->
  <div id="sticky-cta" class="sticky-cta" hidden>
    <a class="sticky-cta-btn kakao" id="sticky-kakao" href="#" target="_blank" rel="noopener">💬 카톡 상담</a>
    <a class="sticky-cta-btn insta" id="sticky-insta" href="#" target="_blank" rel="noopener">📷 인스타 DM</a>
  </div>

  <!-- 후기 작성 모달 -->
  <div id="review-modal" class="review-modal" hidden>
    <div class="review-modal-box">
      <button type="button" class="review-modal-close" id="review-close" aria-label="닫기">×</button>
      <div id="review-form-wrap">
        <h3>후기 작성</h3>
        <p class="review-lead">편하게 <strong>2~3줄</strong>이면 충분해요. 솔직한 한마디가 큰 힘이 됩니다 🙏</p>
        <form id="review-form">
          <label>별점</label>
          <div class="star-input" id="star-input" data-value="5">
            <span data-star="1">★</span><span data-star="2">★</span><span data-star="3">★</span><span data-star="4">★</span><span data-star="5">★</span>
          </div>
          <label>후기 내용 <span class="req">*</span></label>
          <textarea name="text" required maxlength="1000" rows="5" placeholder="예) 운동이 처음이라 무서웠는데 차근차근 잡아주셔서, 3개월 만에 허리 통증도 줄고 7kg 빠졌어요. 운동 초보분들께 강추합니다!"></textarea>
          <div class="review-tips">💡 떠오르는 것만 적어도 좋아요 — <b>운동 전 고민</b> / <b>좋았던 점</b> / <b>달라진 점</b>(숫자면 더 좋아요) / <b>추천하고 싶은 분</b></div>

          <details class="review-more">
            <summary>＋ 이름·나이·사진 넣기 <span class="opt">(선택)</span></summary>
            <div class="review-more-body">
              <label>이름 / 닉네임</label>
              <input type="text" name="memberName" maxlength="20" placeholder="예: 김O영 / 30대 회원" />
              <div class="form-row">
                <div>
                  <label>성별</label>
                  <select name="gender">
                    <option value="">선택 안 함</option>
                    <option>여성</option>
                    <option>남성</option>
                  </select>
                </div>
                <div>
                  <label>나이대</label>
                  <select name="memberAge">
                    <option value="">선택 안 함</option>
                    <option>20대</option>
                    <option>30대</option>
                    <option>40대</option>
                    <option>50대 이상</option>
                  </select>
                </div>
              </div>
              <label>목표</label>
              <input type="text" name="memberGoal" maxlength="30" placeholder="예: 다이어트, 체형교정" />
              <label>사진 첨부 <span class="opt">(1장 — 비포/애프터면 더 좋아요)</span></label>
              <input type="file" name="image" accept="image/*" />
            </div>
          </details>

          <div class="form-msg" id="review-msg"></div>
          <button type="submit" class="review-submit" id="review-submit">후기 등록하기</button>
        </form>
      </div>
      <div class="review-done" id="review-done" hidden>
        <p>✅ 후기가 등록되었어요!<br />확인 후 사이트에 공개됩니다.<br />소중한 후기 감사합니다 🙏</p>
        <button type="button" id="review-done-close" class="review-submit">닫기</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="assets/js/firebase-init.js?v=35"></script>
  <script src="assets/js/main.js?v=35"></script>
</body>
</html>
